name: publish site

# Runs on every push to main that touches the site, and by hand when you want a
# redeploy with no changes. Pages Source must be "GitHub Actions" for the deploy
# step to have somewhere to go; it is set that way on wuzzynizzy/wuzzynizzy.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: static checks
        run: python3 site/check.py

      - name: configure pages
        uses: actions/configure-pages@v5
        with:
          # turns Pages on with Source: GitHub Actions if it is not on yet,
          # which is the one setting this workflow cannot otherwise assume
          enablement: true

      - name: upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
